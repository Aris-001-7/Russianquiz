<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Падежи — Тест 1–50</title>
<style>
:root{--bg:#f4f1fa;--card:#fff;--tx:#1f1b2e;--mu:#6b6580;--ac:#673ab7;--bd:#dcd6ea;--ok:#1e8e3e;--okb:#e6f4ea;--no:#d93025;--nob:#fce8e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17141f;--card:#221e2e;--tx:#ece8f5;--mu:#a49db8;--ac:#b39ddb;--bd:#3a3450;--ok:#81c995;--okb:#173324;--no:#f28b82;--nob:#3b1d1b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:680px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px}
.hd{border-top:10px solid var(--ac)}
h1{margin:0 0 4px;font-size:22px}
.mu{color:var(--mu);font-size:14px}
.q{font-weight:600;margin-bottom:10px}
label{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--bd);border-radius:8px;margin-bottom:6px;cursor:pointer}
label:has(input:checked){border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent)}
input{accent-color:var(--ac);margin-top:4px}
.ok{background:var(--okb)!important;border-color:var(--ok)!important}
.no{background:var(--nob)!important;border-color:var(--no)!important}
.pt{font-size:13px;margin-top:6px;font-weight:600}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:12px 22px;font-size:16px;cursor:pointer}
button.g{background:transparent;color:var(--ac);border:1px solid var(--ac);margin-left:8px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0;z-index:5}
.pb{height:6px;background:var(--bd);border-radius:3px;overflow:hidden}
.pb i{display:block;height:100%;width:0;background:var(--ac);transition:width .2s}
#res{text-align:center;font-size:20px;font-weight:700}
</style>
</head>
<body>
<div class="w">
<div class="card hd"><h1>Падежи — Тест (1–50)</h1><div class="mu">Выберите один ответ. Правильный ответ = 1 балл, неправильный = 0.</div></div>
<div class="bar"><div class="pb"><i id="pb"></i></div><div class="mu" id="pc">0 / 50</div></div>
<div id="qs"></div>
<div class="card" id="res" hidden></div>
<div style="margin-bottom:40px"><button id="sub">Отправить</button><button class="g" id="rst">Сбросить</button></div>
</div>
<script>
const D=[
["Я часто пишу письма ….",["младшие братья","младшими братьями","младших братьев","младшим братьям"],3],
["В прошлом году я был ….",["младшие братья","младшими братьями","у младших братьев","младшим братьям"],2],
["Я ходил на стадион ….",["младшие братья","с младшими братьями","у младших братьев","младшим братьям"],1],
["Скоро у нас будет экзамен ….",["английский язык","английском языке","английским языком","по английскому языку"],3],
["Я люблю заниматься ….",["английский язык","английского языка","английским языком","по английскому языку"],2],
["Мы ждём преподавателя ….",["английский язык","английского языка","английским языком","английском языке"],1],
["В Петербурге всегда много ….",["иностранные туристы","иностранных туристов","иностранным туристам","иностранными туристами"],1],
["Петербург нравится ….",["иностранные туристы","иностранных туристов","иностранным туристам","иностранными туристами"],2],
["В Петербург часто приезжают ….",["иностранные туристы","иностранных туристов","иностранным туристам","иностранными туристами"],0],
["Вчера мы были ….",["интересную экскурсию","интересная экскурсия","на интересной экскурсии","на интересную экскурсию"],2],
["Преподаватели организовали … для студентов.",["интересную экскурсию","интересная экскурсия","на интересной экскурсии","на интересную экскурсию"],0],
["… закончилась в 3 часа.",["интересную экскурсию","интересная экскурсия","на интересной экскурсии","на интересную экскурсию"],1],
["Моему другу нравится ….",["профессия артиста","профессией артиста","профессию артиста","профессии артиста"],0],
["Он интересно рассказывает ….",["профессия артиста","профессией артиста","профессию артиста","о профессии артиста"],3],
["Я живу рядом ….",["от центрального проспекта","с центральным проспектом","на центральном проспекте","с центрального проспекта"],1],
["Этот магазин находится ….",["от центрального проспекта","с центральным проспектом","на центральном проспекте","с центрального проспекта"],2],
["Мы встретились недалеко ….",["от центрального проспекта","с центральным проспектом","на центральном проспекте","с центрального проспекта"],0],
["У меня нет ….",["синяя ручка","синей ручки","синюю ручку","синей ручкой"],1],
["Дай, пожалуйста ….",["синяя ручка","синей ручки","синюю ручку","синей ручкой"],2],
["Я всегда пишу ….",["синяя ручка","синей ручки","синюю ручку","синей ручкой"],3],
["В больнице работает много ….",["врачи","врачей","врача","врач"],1],
["Все … пришли на собрание.",["врачи","врачей","врача","врач"],0],
["В кабинете было 3 ….",["врачи","врачей","врача","врач"],2],
["В институте работает много ….",["врачи","врачей","врача","врач"],1],
["У Марты много ….",["подругам","подруг","подруги","подруга"],1],
["Марта всегда помогает ….",["подругам","подруг","подруги","подруга"],0],
["Она часто встречает … на дискотеке.",["подругам","подруг","подруги","подруга"],1],
["… — самый тёплый месяц года.",["июль","июля","в июле","к июлю"],0],
["Мой друг поедет домой ….",["июль","июля","в июле","к июлю"],2],
["День рождения брата 15 ….",["июль","июля","в июле","к июлю"],1],
["Борис знает много ….",["русские стихи","русскими стихами","русских стихов","русским стихам"],2],
["Борис хорошо читает ….",["русских стихов","русские стихи","русскими стихами","русским стихам"],1],
["Мне тоже нравятся ….",["русских стихов","русские стихи","русскими стихами","русским стихам"],1],
["Эту статью написал ….",["известному журналисту","известный журналист","с известным журналистом","известному журналисту"],1],
["Недавно мы познакомились ….",["известному журналисту","известный журналист","с известным журналистом","известном журналисте"],2],
["Мой друг получил письмо ….",["известному журналисту","известный журналист","от известного журналиста","известном журналисте"],2],
["Виктор увлекается ….",["классическая музыка","классическую музыку","классической музыки","классической музыкой"],3],
["Он часто ходит на концерты ….",["классическая музыка","классическую музыку","классической музыки","классической музыкой"],2],
["Я тоже люблю слушать ….",["классическая музыка","классическую музыку","классической музыки","классической музыкой"],1],
["Моя подруга — студентка ….",["Театральная академия","о Театральной академии","Театральную академию","Театральной академии"],3],
["Я тоже мечтаю поступить ….",["Театральная академия","в Театральной академии","в Театральную академию","к Театральной академии"],2],
["На этой площади находится ….",["Театральная академия","в Театральной академии","Театральную академию","к Театральной академии"],0],
["Машина остановилась около ….",["в соседнем доме","соседнего дома","к соседнему дому","в соседний дом"],1],
["Моя подруга переехала ….",["в соседнем доме","соседнего дома","к соседнему дому","в соседний дом"],3],
["Мы купили сувениры ….",["к Невскому проспекту","на Невском проспекте","Невским проспектом","от Невского проспекта"],1],
["Памятник Гоголю находится рядом ….",["к Невскому проспекту","на Невском проспекте","с Невским проспектом","от Невского проспекта"],2],
["Борис живёт недалеко ….",["от Невского проспекта","на Невском проспекте","с Невским проспектом","к Невскому проспекту"],0],
["На вечере мы встретились ….",["о талантливом музыканте","с талантливым музыкантом","талантливому музыканту","талантливого музыканта"],1],
["От преподавателя мы узнали ….",["о талантливом музыканте","с талантливым музыкантом","талантливому музыканту","талантливого музыканта"],0],
["На концерт пригласили ….",["о талантливом музыканте","с талантливым музыкантом","талантливому музыканту","талантливого музыканта"],3]
];
const L="АБВГ",qs=document.getElementById("qs"),res=document.getElementById("res");
let done=false;
function build(){
 qs.innerHTML="";done=false;res.hidden=true;
 D.forEach((d,i)=>{
  const c=document.createElement("div");c.className="card";c.id="c"+i;
  c.innerHTML=`<div class="q">${i+1}. ${d[0]}</div>`+d[1].map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}"><span>${L[j]}. ${o}</span></label>`).join("")+`<div class="pt" hidden></div>`;
  qs.appendChild(c);
 });
 upd();
}
function upd(){
 const n=D.filter((_,i)=>document.querySelector(`input[name=q${i}]:checked`)).length;
 pc.textContent=n+" / 50";pb.style.width=n*2+"%";
}
qs.addEventListener("change",upd);
sub.onclick=()=>{
 if(done)return;
 const un=D.map((_,i)=>i).filter(i=>!document.querySelector(`input[name=q${i}]:checked`));
 if(un.length&&!confirm("Без ответа: "+un.length+". Всё равно отправить?")){document.getElementById("c"+un[0]).scrollIntoView({behavior:"smooth",block:"center"});return}
 done=true;let s=0;
 D.forEach((d,i)=>{
  const c=document.getElementById("c"+i),ls=c.querySelectorAll("label"),ch=c.querySelector("input:checked"),p=c.querySelector(".pt");
  ls.forEach(l=>l.querySelector("input").disabled=true);
  ls[d[2]].classList.add("ok");
  p.hidden=false;
  if(ch&&+ch.value===d[2]){s++;p.textContent="1 / 1 балл";p.style.color="var(--ok)"}
  else{if(ch)ls[+ch.value].classList.add("no");p.textContent="0 / 1 балл — правильно: "+L[d[2]];p.style.color="var(--no)"}
 });
 res.hidden=false;res.textContent="Результат: "+s+" / 50 ("+Math.round(s*2)+"%)";
 res.scrollIntoView({behavior:"smooth"});
};
rst.onclick=()=>{build();scrollTo(0,0)};
build();
</script>
</body>
</html>
